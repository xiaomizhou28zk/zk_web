<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发表文章</title>
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <div class="header-left">
        <a href="index.html" class="logo">📚 阿瑞之家</a>
        <a href="index.html" class="nav-home">首页</a>
      </div>
      <div class="header-right">
        <span id="header-user" class="header-user"></span>
      </div>
    </div>
  </header>

  <main class="main-content publish-page">
    <div class="publish-container">
      <h1 class="publish-title" id="publish-page-title">写文章</h1>
      <p class="publish-desc">分享你的想法与见解</p>

      <form id="publish-form" class="publish-form">
        <div class="publish-card">
          <div class="publish-row publish-row-title">
            <input type="text" id="publish-title" class="publish-title-input" placeholder="文章标题" maxlength="80" required autocomplete="off">
          </div>
          <div class="publish-row">
            <input type="text" id="publish-summary" class="publish-summary-input" placeholder="一句话简介，吸引读者" maxlength="200" required autocomplete="off">
          </div>
          <div class="publish-row publish-row-cover">
            <label class="publish-cover-label">封面</label>
            <div class="publish-cover-cell">
              <div id="cover-preview-box" class="cover-preview-box">
                <img id="cover-preview-img" class="cover-preview-img" alt="封面预览" />
                <span id="cover-preview-placeholder" class="cover-preview-placeholder" aria-hidden="true">📝</span>
              </div>
              <input type="file" id="cover-file" class="publish-cover-file" accept="image/jpeg,image/png,image/gif,image/webp,.jpg,.jpeg,.png,.gif,.webp" title="单张图片不超过 10MB">
              <button type="button" class="btn btn-ghost publish-cover-btn" id="cover-pick-btn">上传图片</button>
              <button type="button" class="btn btn-ghost publish-cover-btn" id="cover-clear-btn">清除</button>
              <input type="hidden" id="publish-cover" value="">
            </div>
          </div>
        </div>

        <div class="publish-card publish-editor-card">
          <label class="publish-editor-label">正文</label>
          <div id="quill-editor" class="publish-editor"></div>
        </div>

        <div class="publish-actions">
          <button type="button" class="btn btn-ghost" id="publish-draft">保存草稿</button>
          <button type="submit" class="btn btn-primary btn-publish" id="publish-submit">发布</button>
          <a href="index.html" class="btn btn-ghost" id="publish-cancel">取消</a>
          <span id="publish-msg" class="publish-msg" aria-live="polite"></span>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2025 阿瑞之家 · 仅供演示</div>
  </footer>

  <!-- 插入视频链接（自定义居中弹层，替代浏览器 prompt） -->
  <div id="video-url-modal" class="video-url-modal" aria-hidden="true">
    <div class="video-url-modal-backdrop" id="video-url-modal-backdrop"></div>
    <div class="video-url-modal-box" role="dialog" aria-modal="true" aria-labelledby="video-url-modal-title">
      <div class="video-url-modal-header">
        <h2 id="video-url-modal-title" class="video-url-modal-title">插入视频链接</h2>
        <button type="button" class="video-url-modal-close" id="video-url-modal-close" aria-label="关闭">&times;</button>
      </div>
      <p class="video-url-modal-hint">支持 YouTube、bilibili 视频页链接，或 mp4、webm、mov 等直链。</p>
      <label class="video-url-modal-label" for="video-url-modal-input">视频地址</label>
      <input type="text" id="video-url-modal-input" class="auth-input video-url-modal-field" placeholder="https://…" autocomplete="off" spellcheck="false" />
      <div class="video-url-modal-actions">
        <button type="button" class="btn btn-ghost video-url-modal-btn" id="video-url-modal-cancel">取消</button>
        <button type="button" class="btn btn-primary video-url-modal-btn" id="video-url-modal-confirm">插入</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/header-user.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
