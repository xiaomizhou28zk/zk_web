<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <div class="header-left">
        <a href="index.html" class="logo">📚 阿瑞之家</a>
        <a href="index.html" class="nav-home">首页</a>
      </div>
      <div class="header-search">
        <input type="search" id="search-input" class="search-input header-search-input" placeholder="搜索标题、简介、作者…" autocomplete="off">
        <button type="button" id="search-btn" class="header-search-btn" aria-label="搜索">搜索</button>
      </div>
      <div class="header-right">
        <div class="nav-add-wrap">
          <button type="button" class="nav-add-btn" aria-expanded="false" aria-haspopup="true" aria-label="发表">
            <span class="nav-add-icon">+</span>
          </button>
          <div class="nav-add-dropdown">
            <a href="publish.html" class="nav-add-action">✏️ 写文章</a>
          </div>
        </div>
        <span id="header-user" class="header-user"></span>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <div class="main-layout">
      <div class="main-body">
        <section class="featured-section" aria-label="推荐精选">
          <h2 class="featured-title">推荐精选</h2>
          <div class="featured-scroll-outer">
            <div id="featured-list" class="featured-scroll" role="list"></div>
          </div>
        </section>
        <section class="waterfall-section" aria-label="文章列表">
          <div id="article-list" class="article-waterfall"></div>
        </section>
      </div>
      <aside class="hot-sidebar" aria-label="热度榜">
        <h2 class="hot-sidebar-title">热度榜</h2>
        <div class="hot-tabs" role="tablist">
          <span class="hot-tabs-glider" aria-hidden="true"></span>
          <button type="button" class="hot-tab is-active" role="tab" aria-selected="true" data-hot="total">总榜</button>
          <button type="button" class="hot-tab" role="tab" aria-selected="false" data-hot="week">周榜</button>
          <button type="button" class="hot-tab" role="tab" aria-selected="false" data-hot="day">日榜</button>
        </div>
        <div id="hot-list" class="hot-list" role="tabpanel"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2025 阿瑞之家 · 仅供演示</div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/header-user.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
