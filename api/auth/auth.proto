syntax = "proto3";

package blog.v1;

import "google/api/annotations.proto";

option go_package = "yourmodule/blog/v1;blogv1";

// =============================================================================
// 登录鉴权
// =============================================================================

// LoginRequest 登录请求（POST /api/auth/login）
message LoginRequest {
  string account = 1;  // 账号或邮箱，必填
  string password = 2; // 密码，必填
}

// LoginResponse 登录响应
message LoginResponse {
  string token = 1; // 鉴权令牌，前端后续请求放在 Header（如 Authorization: Bearer <token>）
}

// RegisterRequest 注册请求（POST /api/auth/register）
message RegisterRequest {
  string nickname = 1; // 昵称，必填
  string account = 2;   // 账号或邮箱，必填，需唯一
  string password = 3;  // 密码，必填
}

// RegisterResponse 注册响应（与登录一致）
message RegisterResponse {
  string token = 1; // 鉴权令牌
}

// LogoutRequest 退出登录请求（POST /api/auth/logout，可选）
message LogoutRequest {}

// LogoutResponse 退出登录响应（无 body 或仅返回成功即可）
message LogoutResponse {}

// AuthService 登录鉴权服务
service AuthService {
  // 登录：账号或邮箱 + 密码，返回 token 及可选 user
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }

  // 注册新用户：昵称、账号、密码，返回 token 及可选 user
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/auth/register"
      body: "*"
    };
  }

  // 退出登录：服务端使当前 token 失效（可选）
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = { post: "/api/auth/logout" };
  }
}
