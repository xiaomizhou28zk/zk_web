syntax = "proto3";

package blog.v1;

import "google/api/annotations.proto";

option go_package = "yourmodule/blog/v1;blogv1";

// =============================================================================
// 个人信息
// =============================================================================

// User 当前登录用户信息（顶栏头像、弹窗、个人资料页等使用）
message User {
  string id = 1;        // 用户唯一标识，后端生成
  string nickname = 2; // 昵称，展示在顶栏与评论身份
  string avatar = 3;   // 头像：emoji 或 URL
  string bio = 4;      // 个人简介/签名，展示在头像弹窗中
}

// GetCurrentUserRequest 获取当前用户请求（无需参数，依赖鉴权 token/session）
message GetCurrentUserRequest {}

// GetCurrentUserResponse 获取当前用户响应
message GetCurrentUserResponse {
  User user = 1; // 已登录时返回用户信息；未登录时为空，前端展示「未登录」等
}

// UpdateProfileRequest 更新昵称、头像（需登录；头像可为 emoji 或图片 URL）
message UpdateProfileRequest {
  string nickname = 1; // 最多 15 个 Unicode 字符（与前端 maxlength 一致）
  string avatar = 2;
}

// UpdateProfileResponse 更新后的用户信息
message UpdateProfileResponse {
  User user = 1;
}

// UserService 个人信息服务
service UserService {
  // 获取当前登录用户信息，用于顶栏、弹窗、个人资料与评论身份展示
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = { get: "/api/user/me" };
  }

  // 更新当前用户资料（昵称、头像）
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      post: "/api/user/profile"
      body: "*"
    };
  }
}
